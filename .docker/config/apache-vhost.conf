# =============================================================================
# Apache Virtual Host Konfiguration
# Document Root: /httpdocs
# =============================================================================

<VirtualHost *:80>
    # Server-Informationen
    ServerAdmin webmaster@localhost
    ServerName localhost

    # Document Root auf /httpdocs setzen
    DocumentRoot /httpdocs

    # Verzeichnis-Konfiguration
    <Directory /httpdocs>
        # .htaccess Dateien erlauben
        AllowOverride All

        # Zugriff erlauben
        Require all granted

        # Directory Listing deaktivieren
        Options -Indexes +FollowSymLinks

        # PHP-Dateien als Index
        DirectoryIndex index.php index.html
    </Directory>

    # Fehler- und Zugriffslogs
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # PHP-Dateien verarbeiten
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>

</VirtualHost>
