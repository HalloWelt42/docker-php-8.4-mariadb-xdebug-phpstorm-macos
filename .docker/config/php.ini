; =============================================================================
; PHP Entwicklungskonfiguration
; =============================================================================

; -----------------------------------------------------------------------------
; Fehlerbehandlung (Entwicklungsmodus)
; -----------------------------------------------------------------------------
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /var/log/php_errors.log

; -----------------------------------------------------------------------------
; Zeitzone
; -----------------------------------------------------------------------------
date.timezone = Europe/Berlin

; -----------------------------------------------------------------------------
; Upload-Limits (großzügig für Entwicklung)
; -----------------------------------------------------------------------------
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 20

; -----------------------------------------------------------------------------
; Speicher & Ausführungszeit
; -----------------------------------------------------------------------------
memory_limit = 256M
max_execution_time = 300
max_input_time = 300

; -----------------------------------------------------------------------------
; Xdebug 3 Konfiguration
; -----------------------------------------------------------------------------
[xdebug]
; Debug-Modus: debug = Step Debugging, develop = verbesserte var_dump()
xdebug.mode = debug,develop

; IDE-Verbindung (host.docker.internal = Host-Rechner auf macOS)
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003

; Automatisch bei jedem Request starten (kein Browser-Plugin nötig)
xdebug.start_with_request = yes

; IDE-Key für PHPStorm/VSCode
xdebug.idekey = PHPSTORM

; Bessere var_dump() Ausgabe
xdebug.var_display_max_depth = 5
xdebug.var_display_max_children = 256
xdebug.var_display_max_data = 1024

; Log-Datei für Debugging-Probleme (auskommentieren wenn nicht benötigt)
; xdebug.log = /var/log/xdebug.log

; -----------------------------------------------------------------------------
; OPcache (für Entwicklung optimiert)
; -----------------------------------------------------------------------------
[opcache]
opcache.enable = 1
opcache.enable_cli = 1
; Dateien bei jedem Request prüfen (wichtig für Entwicklung!)
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000

; -----------------------------------------------------------------------------
; Session
; -----------------------------------------------------------------------------
session.save_handler = files
session.save_path = /tmp
session.gc_maxlifetime = 1440
